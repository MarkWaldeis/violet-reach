name: gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  blender-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Blender gate (only approved assets may ship)
        run: python3 tools/vr.py check
      - name: Gate self-test
        run: python3 tools/test_gate.py
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
