name: gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  blender-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Blender gate (only approved assets may ship)
        run: python3 tools/vr.py check
      - name: Gate self-test
        run: python3 tools/test_gate.py
      - name: World integrity test
        run: python3 tools/world/test_world.py
      - name: Tree rollout applier test
        run: python3 tools/test_tree_rollout_apply.py
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
  web-explore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/explore
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/explore/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
