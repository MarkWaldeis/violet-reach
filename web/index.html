<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Violet Reach · Asset-Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #viewer-details { position: fixed; inset: 0; pointer-events: none; color: #f4eeff; }
      header { position: absolute; top: clamp(16px, 4vw, 48px); left: clamp(16px, 4vw, 48px);
               padding: 14px 20px 16px; background: #14121be0; border: 1px solid #bfa5f460;
               border-left: 3px solid #bfa5f4; border-radius: 2px 10px 10px 2px; }
      .eyebrow { color: #d1bcfc; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 6px 0 0; font: 500 clamp(18px, 3vw, 29px)/1.1 Georgia, serif; }
      footer { position: absolute; bottom: 16px; left: 16px; right: 16px; display: flex; flex-wrap: wrap;
               justify-content: space-between; gap: 8px 16px; font-size: 11px; color: #f0eaff; }
      footer span { background: #14121be0; border-radius: 5px; padding: 7px 10px; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; color: #f4eeff;
                background: #14121be0; padding: 24px; text-align: center; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="viewer-details" hidden>
      <header>
        <div class="eyebrow">Violet Reach / Asset-Viewer</div>
        <h1 id="asset-title"></h1>
      </header>
      <footer>
        <span id="hud"></span>
        <span>Ziehen: Drehen · Scrollen: Zoomen</span>
      </footer>
    </div>
    <div id="status" role="status">Lade …</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
